<script>
// cool white by day, ink by night (her picks, 2026-09-07/08), or — her own
// opt-in pick only, never the phone's setting — cute (2026-09-21): the
// ground is stamped on <html> before the first paint from the sync drawer's
// pick (c7-theme: light | dark | cute), else the phone's own setting. The
// theme-color is the top bar's colour: --bar-bg white by day, --ink-0 by night and cute (both dark).
(function () {
  var mq = window.matchMedia('(prefers-color-scheme: light)');
  function apply() {
    var pref = null;
    try { pref = localStorage.getItem('c7-theme'); } catch (e) {}
    var t = pref === 'light' || pref === 'dark' || pref === 'cute' ? pref : (mq.matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = t;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = t === 'light' ? '#ffffff' : t === 'cute' ? '#1b1420' : '#15181d';
  }
  apply();
  if (mq.addEventListener) mq.addEventListener('change', apply);
  window.c7ApplyTheme = apply;
})();
</script>
